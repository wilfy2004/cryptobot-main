<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart View Only</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        
        h1 {
            margin: 0;
            text-align: center;
            font-size: 18px;
            flex: 1;
        }
        
        #tradingview_widget {
            flex: 1;
            width: 100%;
            min-height: 75vh;
        }
        
        .nav-button {
            padding: 8px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        
        .coin-info {
            text-align: center;
            padding: 5px;
            background-color: #e8f5e9;
            color: #1b5e20;
            font-weight: bold;
        }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div id="app">
        <div class="header">
            <a href="index.html" class="nav-button">← Back</a>
            <h1>Chart View</h1>
            <div style="width: 70px;"></div>
        </div>
        
        <div id="active-coin" class="coin-info">Loading chart...</div>
        
        <div id="tradingview_widget"></div>
    </div>
    
    <script>
        // ISOLATED: Only use URL parameters, no storage access at all
        function getSymbolFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            let symbol = urlParams.get('symbol');
            
            // If no symbol in URL, use a visual placeholder that doesn't affect trading
            if (!symbol) {
                symbol = "BTCUSDT";
            }
            
            // Format symbol if needed
            if (!symbol.endsWith("USDT") && !symbol.endsWith("USD") && 
                !symbol.endsWith("BUSD") && !symbol.endsWith("USDC")) {
                symbol = symbol + "USDT";
            }
            
            return symbol;
        }
        
        // Initialize chart using ONLY the URL parameter
        function initChart() {
            const symbol = getSymbolFromUrl();
            document.getElementById('active-coin').textContent = "Viewing: " + symbol;
            
            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:" + symbol,
                "interval": "5", // 5-minute candles
                "timezone": "Etc/UTC",
                "theme": "light",
                "style": "1", // Candlestick chart
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "withdateranges": true,
                "hide_side_toolbar": true,
                "hide_volume": false,
                "container_id": "tradingview_widget",
                "studies": ["RSI@tv-basicstudies", "MACD@tv-basicstudies"],
                "disabled_features": [
                    "header_symbol_search",
                    "header_compare",
                    "header_undo_redo",
                    "header_screenshot",
                    "header_saveload",
                    "left_toolbar",
                    "volume_force_overlay"
                ],
                "enabled_features": [
                    "move_logo_to_main_pane",
                    "hide_last_na_study_output"
                ],
                "overrides": {
                    "mainSeriesProperties.candleStyle.upColor": "#26a69a",
                    "mainSeriesProperties.candleStyle.downColor": "#ef5350",
                    "mainSeriesProperties.candleStyle.wickUpColor": "#26a69a",
                    "mainSeriesProperties.candleStyle.wickDownColor": "#ef5350",
                    "mainSeriesProperties.candleStyle.drawBorder": false,
                    "paneProperties.background": "#ffffff",
                    "paneProperties.vertGridProperties.color": "#f5f5f5",
                    "paneProperties.horzGridProperties.color": "#f5f5f5",
                    "scalesProperties.textColor": "#333333",
                    "scalesProperties.fontSize": 12
                }
            });
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initChart);
    </script>
</body>
</html>
