<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Coin Chart - Trading Bot Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        /* Mobile optimizations */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        
        h1 {
            margin: 0;
            text-align: center;
            font-size: 18px;
            flex: 1;
        }
        
        #tradingview_widget {
            flex: 1;
            width: 100%;
            min-height: 75vh; /* Use most of the screen height */
        }
        
        .nav-button {
            padding: 8px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        
        .coin-info {
            text-align: center;
            padding: 5px;
            background-color: #e8f5e9;
            color: #1b5e20;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <a href="index.html" class="nav-button">← Back</a>
            <h1>Active Coin Chart</h1>
            <div style="width: 70px;"></div> <!-- Spacer for balance -->
        </div>
        
        <div id="active-coin" class="coin-info">Loading active coin...</div>
        
        <div id="tradingview_widget"></div>
    </div>
    
    <script>
        // Function to get URL parameters
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // Function to initialize the chart
        function initChart(symbol) {
            // Format symbol if needed
            if (!symbol.endsWith("USDT") && !symbol.endsWith("USD") && 
                !symbol.endsWith("BUSD") && !symbol.endsWith("USDC")) {
                symbol = symbol + "USDT";
            }
            
            // Update the coin info display
            document.getElementById('active-coin').textContent = "Active Coin: " + symbol;
            
            // Initialize the TradingView widget
            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:" + symbol,
                "interval": "5", // 5-minute candles
                "timezone": "Etc/UTC",
                "theme": "light",
                "style": "1", // Candlestick chart
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "withdateranges": true,
                "hide_side_toolbar": true, // Hide side toolbar on mobile
                "hide_volume": false,
                "container_id": "tradingview_widget",
                "studies": ["RSI@tv-basicstudies", "MACD@tv-basicstudies"],
                "disabled_features": [
                    "header_symbol_search",
                    "header_compare",
                    "header_undo_redo",
                    "header_screenshot",
                    "header_saveload",
                    "left_toolbar",
                    "volume_force_overlay"
                ],
                "enabled_features": [
                    "move_logo_to_main_pane",
                    "hide_last_na_study_output"
                ],
                "overrides": {
                    "mainSeriesProperties.candleStyle.upColor": "#26a69a",
                    "mainSeriesProperties.candleStyle.downColor": "#ef5350",
                    "mainSeriesProperties.candleStyle.wickUpColor": "#26a69a",
                    "mainSeriesProperties.candleStyle.wickDownColor": "#ef5350",
                    "mainSeriesProperties.candleStyle.drawBorder": false,
                    "paneProperties.background": "#ffffff",
                    "paneProperties.vertGridProperties.color": "#f5f5f5",
                    "paneProperties.horzGridProperties.color": "#f5f5f5",
                    "scalesProperties.textColor": "#333333",
                    "scalesProperties.fontSize": 12 // Larger font for better readability
                }
            });
        }
        
        // Set up the chart when the DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Try to get symbol from multiple sources (in order of priority) but NEVER set it back
            let symbol = getUrlParam('symbol') || // URL parameter
                        localStorage.getItem('viewCoin') || // View-only storage
                        sessionStorage.getItem('viewCoin'); // View-only session storage
            
            // Only check activeTradeSymbol if we have no other source
            if (!symbol) {
                // READ ONLY - do not write back to these values
                symbol = localStorage.getItem('activeCoin') || // Local storage (read only)
                         sessionStorage.getItem('activeCoin') || // Session storage (read only)
                         'BTCUSDT'; // Default fallback that doesn't affect trading
                
                // Store in viewCoin so we don't need to touch activeCoin again
                localStorage.setItem('viewCoin', symbol);
            }
            
            // Initialize the chart with the found symbol
            initChart(symbol);
        });
    </script>
    
    <script src="app.js"></script>
</body>
</html>
